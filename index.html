<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карточки слов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --desk:#D8E1EA;--card:#FFFEFA;--rule:#D3E0EE;--margin:#DD4459;--ink:#16223F;--ink-2:#56637F;--ink-3:#8A95AB;
  --line:#C3CEDB;--accent:#2747B8;--accent-2:#9DB0EC;--on-accent:#fff;--good:#1E8456;--hard:#B47708;--again:#CF3B50;--on-g:#fff;
  --sh1:rgba(22,34,63,.08);--sh2:rgba(22,34,63,.35);--soft:#E6ECF3;--note:#FFF4D6;--note-ink:#6B4A00;--ai-bg:#EDE7FB;--ai-ink:#5B3CC4;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0E1828;--card:#18253A;--rule:#22334C;--margin:#E0566B;--ink:#E7EDF6;--ink-2:#9FACC2;--ink-3:#6D7B94;
  --line:#2C3D57;--accent:#86A0FF;--accent-2:#3D4F86;--on-accent:#0E1828;--good:#4CC08A;--hard:#E3AE47;--again:#F07082;--on-g:#0E1828;
  --sh1:rgba(0,0,0,.3);--sh2:rgba(0,0,0,.6);--soft:#142136;--note:#3A3115;--note-ink:#F2D58A;--ai-bg:#2E2652;--ai-ink:#C9B8FF;color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0E1828;--card:#18253A;--rule:#22334C;--margin:#E0566B;--ink:#E7EDF6;--ink-2:#9FACC2;--ink-3:#6D7B94;
  --line:#2C3D57;--accent:#86A0FF;--accent-2:#3D4F86;--on-accent:#0E1828;--good:#4CC08A;--hard:#E3AE47;--again:#F07082;--on-g:#0E1828;
  --sh1:rgba(0,0,0,.3);--sh2:rgba(0,0,0,.6);--soft:#142136;--note:#3A3115;--note-ink:#F2D58A;--ai-bg:#2E2652;--ai-ink:#C9B8FF;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:var(--desk);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font:16px/1.5 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 56px}
.top{display:flex;align-items:center;gap:6px;min-height:56px;margin:4px 0}
.title{font-family:Literata,Georgia,"Times New Roman",serif;font-weight:600;font-size:34px;line-height:1.1;margin:0;letter-spacing:-.01em;flex:1;min-width:0}
.title.sm{font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h2{font-size:17px;font-weight:600;margin:0;line-height:1.3}
.h3{font-size:14px;font-weight:600;color:var(--ink-2);margin:18px 0 8px}
.lede{color:var(--ink-2);margin:0 0 16px;max-width:60ch}
.note{color:var(--ink-2);font-size:14px;margin:12px 0}
.err{color:var(--again);font-size:15px;margin:12px 0}
.loading{color:var(--ink-2);padding:48px 0;text-align:center}
.icon{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;background:transparent;border-radius:12px;color:var(--ink);padding:0}
.icon:hover{background:var(--soft)}
.icon svg{width:22px;height:22px}
.icon.sm{width:38px;height:38px;color:var(--ink-2)}
.icon.sm svg{width:19px;height:19px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600;text-align:center;line-height:1.25}
.btn.quiet{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.danger{background:var(--again);color:var(--on-g)}
.btn.danger-text{color:var(--again)}
.btn.small{min-height:38px;padding:6px 14px;font-size:15px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.ai{display:inline-block;font-size:11px;font-weight:700;line-height:1;padding:4px 6px;border-radius:6px;background:var(--ai-bg);color:var(--ai-ink);letter-spacing:.03em;vertical-align:1px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.row>.btn{flex:1 1 auto}
.link{border:0;background:transparent;color:var(--accent);padding:6px 0;font-weight:600}
.link.danger{color:var(--again)}
.ic{background-color:var(--card);border-radius:10px;box-shadow:0 1px 1px var(--sh1),0 12px 26px -16px var(--sh2)}
.ruled{background-image:linear-gradient(var(--margin),var(--margin)),repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px);background-size:100% 2px,100% 100%;background-position:0 50px,0 52px;background-repeat:no-repeat}
.empty{padding:20px}
.empty p{margin:0 0 16px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--note);color:var(--note-ink);margin:0 0 12px;font-size:15px;border:0;width:100%;text-align:left}
.banner b{font-weight:600}
.banner .grow{flex:1;min-width:0}
.banner .btn{flex:none}
.banner.col{flex-direction:column;align-items:stretch}
.banner.col .row{margin:4px 0 0}
.jobbar{padding:12px 14px;margin:0 0 12px}
.jobbar .jt{display:flex;align-items:center;gap:10px;font-size:15px}
.jobbar .jt span.grow{flex:1;min-width:0}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px}
.pbar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.decks{display:grid;gap:10px;margin-bottom:14px}
.deck{display:flex;align-items:center;width:100%;min-height:74px;padding:0 14px 0 0;border:0;text-align:left;border-radius:10px;color:var(--ink);
  background:linear-gradient(var(--margin),var(--margin)) 64px 0/2px 100% no-repeat,var(--card);box-shadow:0 1px 1px var(--sh1),0 12px 26px -16px var(--sh2)}
.deck .lang{width:64px;flex:none;text-align:center;font-family:Literata,Georgia,serif;font-weight:600;font-size:20px;color:var(--ink-2)}
.dmeta{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column}
.dname{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsub{color:var(--ink-2);font-size:14px}
.due{min-width:32px;height:32px;padding:0 9px;border-radius:16px;background:var(--margin);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:500;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip:disabled{opacity:.4;cursor:default}
.chip .cnt{opacity:.6;margin-left:4px;font-size:13px}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.letters .chip{padding:6px 0;min-height:44px;font-family:Literata,Georgia,serif;font-weight:600;font-size:17px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:42px;font-weight:500;font-size:15px;padding:4px 6px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px var(--sh1),0 2px 6px -2px var(--sh2);font-weight:600}
.mdesc{color:var(--ink-2);font-size:14px;margin:8px 0 0}
.startbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:22px;display:grid;gap:6px}
.startbar .cnt{text-align:center;color:var(--ink-2);font-size:14px;background:var(--desk);border-radius:8px;padding:2px 0}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px}
.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}
.search,.sel{width:100%;min-height:46px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:16px;color:var(--ink)}
.sel{max-width:180px}
.wlist{overflow:hidden}
.wrow{display:grid;grid-template-columns:10px minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:12px 14px;border:0;background:transparent;text-align:left;border-bottom:1px solid var(--rule)}
.wrow:last-child{border-bottom:0}
.wrow:hover{background:var(--soft)}
.ww{font-family:Literata,Georgia,serif;font-weight:600;font-size:17px;overflow-wrap:anywhere;line-height:1.3}
.wt{color:var(--ink-2);font-size:15px;overflow-wrap:anywhere;line-height:1.35}
.flag{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--hard);margin-left:6px;vertical-align:2px}
.more{display:block;width:100%;padding:12px;border:0;background:transparent;color:var(--accent);font-weight:600;border-top:1px solid var(--rule)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-3);flex:none}
.dot.learning{background:var(--hard);box-shadow:none}
.dot.learned{background:var(--good);box-shadow:none}
.dot.again{background:var(--again);box-shadow:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.none{padding:16px;color:var(--ink-2);margin:0}
.fields{display:grid;gap:10px}
.fields label,.sheet label{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.fields input,.fields textarea,.fields select,.ta,.sheet input,.sheet select{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;line-height:1.4}
.fields textarea,.ta{resize:vertical}
.fields small{color:var(--ink-3);font-size:12px;margin-top:-6px}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.draft{padding:14px;margin-bottom:10px}
.draft-head{display:flex;justify-content:flex-end;margin-top:4px}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:14px}
.progress{display:flex;align-items:center;gap:12px;margin:12px 0;color:var(--ink-2);flex-wrap:wrap}
.progress .ptxt{flex:1;min-width:180px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.sug{padding:14px 16px;margin-bottom:10px}
.sug-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sug-word{font-family:Literata,Georgia,serif;font-weight:600;font-size:18px;border:0;background:none;padding:0;color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.sug-num{color:var(--ink-3);font-size:13px}
.sug-note{margin:6px 0 8px;line-height:1.45}
.diff{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:8px 0}
.diff dt{color:var(--ink-2);font-size:13px;padding-top:2px}
.diff dd{margin:0}
.diff del{color:var(--again);text-decoration-thickness:1.5px}
.diff ins{color:var(--good);text-decoration:none;font-weight:600;display:block}
.sugbox{background:var(--note);color:var(--note-ink);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.sugbox .diff dt{color:inherit;opacity:.8}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tile{padding:12px 12px 10px}
.tile b{display:block;font-family:Literata,Georgia,serif;font-size:26px;line-height:1.1;font-weight:600}
.tile span{color:var(--ink-2);font-size:13px}
.chart{padding:14px 14px 10px;margin-bottom:12px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .readout{color:var(--ink-2);font-size:14px;min-height:21px;margin-top:6px}
.chart .bar{fill:var(--accent)}
.chart g[data-tip]:hover .bar,.chart g[data-tip].on .bar{fill:var(--margin)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--ink-3);font-size:10px;font-family:Onest,system-ui,sans-serif}
.trow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--rule);font-size:15px}
.trow:last-child{border-bottom:0}
.meter{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}
.meter i{display:block;height:100%}
.meter .m1{background:var(--good)}.meter .m2{background:var(--hard)}
.trow .num{color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;color:var(--ink-2);font-size:13px;margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tmw{flex:1;min-width:0}
.tmeta{color:var(--ink-2);font-size:14px}
.tbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 0 12px}
.tbar span{display:block;height:100%;background:var(--margin);transition:width .3s}
.flip{perspective:1400px;margin:4px 0 14px}
.flip-inner{position:relative;height:min(58vh,460px);min-height:330px;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;cursor:pointer;border-radius:10px}
.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.fhead{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 18px;color:var(--ink-2);font-size:14px;gap:8px}
.fhead>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbody{flex:1;overflow-y:auto;padding:16px 20px 18px;display:flex;flex-direction:column}
.center{justify-content:center;align-items:center;text-align:center}
.word{font-family:Literata,Georgia,serif;font-weight:600;font-size:clamp(28px,8vw,42px);line-height:1.15;overflow-wrap:anywhere;margin:0}
.word.md{font-size:clamp(23px,6.2vw,31px)}
.word.ru{font-family:Onest,system-ui,sans-serif}
.wsm{font-family:Literata,Georgia,serif;font-weight:600;font-size:22px;line-height:1.25;margin:0 0 2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pos{color:var(--ink-2);font-size:15px;margin-top:6px}
.tr{font-size:20px;font-weight:600;line-height:1.3;margin-top:6px}
.forms{color:var(--ink-2);margin-top:4px}
.ttag{color:var(--ink-3);font-size:13px;margin-top:10px}
.sub{color:var(--ink-3);font-size:13px;font-weight:600;margin:14px 0 2px}
.phr{list-style:none;margin:4px 0 0;padding:0}
.phr li{padding:5px 0}
.pt{display:block;font-family:Literata,Georgia,serif;font-weight:600;line-height:1.35}
.ptr{display:block;color:var(--ink-2);font-size:15px;line-height:1.35}
.blank{display:inline-block;min-width:3.2em;border-bottom:2.5px solid var(--margin);margin:0 .1em}
.label{display:inline-block;background:var(--soft);border-radius:8px;padding:4px 10px;font-weight:600;margin-top:12px}
.say{border:0;background:none;color:var(--ink-3);padding:2px 4px;vertical-align:-3px;line-height:0}
.say svg{width:16px;height:16px}
.hint{color:var(--ink-3);font-size:13px;text-align:center;padding:0 0 14px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g{min-height:58px;border:0;border-radius:12px;font-weight:600;color:var(--on-g);padding:6px;line-height:1.2}
.g.again{background:var(--again)}.g.hard{background:var(--hard)}.g.good{background:var(--good)}
.qcard{margin:4px 0 14px;min-height:210px;display:flex;flex-direction:column}
.opts{display:grid;gap:8px}
.opt{min-height:54px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);text-align:left;font-size:16px;line-height:1.35}
.opt.pl{font-family:Literata,Georgia,serif;font-weight:600;font-size:17px}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--card))}
.opt.bad{border-color:var(--again);background:color-mix(in srgb,var(--again) 16%,var(--card))}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.inp{width:100%;min-height:54px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:18px}
.fb{margin:12px 0 0;font-weight:600}
.fb.ok{color:var(--good)}.fb.almost{color:var(--hard)}.fb.bad{color:var(--again)}
.details{padding:16px 18px;margin:12px 0}
.play{width:92px;height:92px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-bottom:12px}
.play svg{width:40px;height:40px}
.done{padding:22px}
.res{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:8px}
.res li{display:flex;align-items:center;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);width:100%;text-align:left;font-size:15px}
.toggle .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center;font-size:14px;color:var(--on-accent)}
.toggle[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.toggle .grow{flex:1}
.help details{border-bottom:1px solid var(--rule)}
.help details:last-child{border-bottom:0}
.help summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center}
.help summary::-webkit-details-marker{display:none}
.help summary::after{content:'+';color:var(--ink-3);font-size:20px;font-weight:400;line-height:1}
.help details[open] summary::after{content:'−'}
.help .hb{padding:0 16px 14px;color:var(--ink-2);font-size:15px}
.help .hb ol,.help .hb ul{margin:0;padding-left:20px}
.help .hb li{margin:4px 0}
.help .hb p{margin:6px 0}
.help b{color:var(--ink)}
.toggle .cnt{color:var(--ink-2);font-size:13px}
#modal{position:fixed;inset:0;z-index:20;display:none}
#modal.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(10,18,32,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--card);border-radius:16px 16px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:90%;overflow:auto}
.sheet .grp{display:grid;gap:8px}
.sheet .gt{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:6px}
@media (min-width:640px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:16px}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.flip-inner,.tbar span,.pbar span{transition:none}.spin{animation-duration:2.4s}}
</style>

<meta name="theme-color" content="#16223F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>window.__SITE=true;</script>

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-in" accept=".xlsx,.xls,.csv,.json" hidden>
<script id="appjs">

/* ---------- spaced repetition (SM-2) ---------- */
function newSrs(){return {ease:2.5,interval:0,reps:0,lapses:0,due:0};}
function gradeSrs(srs,g){
  const s=Object.assign(newSrs(),srs||{}),now=Date.now();if(!s.first)s.first=dayKey(now);
  if(g==='again'){s.reps=0;s.lapses=(s.lapses||0)+1;s.ease=Math.max(1.3,s.ease-.2);s.interval=0;s.due=now+10*60e3;delete s.learnedAt;return s;}
  if(g==='hard'){s.ease=Math.max(1.3,s.ease-.15);s.interval=s.reps===0?1:Math.max(1,Math.round(s.interval*1.2));}
  else{s.interval=s.reps===0?1:s.reps===1?3:Math.max(s.interval+1,Math.round(Math.max(1,s.interval)*s.ease));}
  s.reps+=1;s.due=startOfDay(now+s.interval*DAY);if(s.interval>=21&&!s.learnedAt)s.learnedAt=now;return s;
}
function status(c){const s=c.srs||{};if(!s.reps&&!s.lapses)return 'new';if((s.interval||0)>=21)return 'learned';return 'learning';}
const isReviewDue=(c,now)=>status(c)!=='new'&&(c.srs.due||0)<=(now||Date.now());
const dailyNew=()=>{const n=+S.profile.dailyNew;return S.profile.dailyNew!=null&&n>=0&&n<=500?n:20;};
function todayList(deckId){
  const cs=cardsOf(deckId),now=Date.now(),today=dayKey();
  const reviews=cs.filter(c=>isReviewDue(c,now)).sort((a,b)=>(a.srs.due||0)-(b.srs.due||0));
  const introduced=cs.filter(c=>c.srs&&c.srs.first===today).length;
  return reviews.concat(cs.filter(c=>status(c)==='new').slice(0,Math.max(0,dailyNew()-introduced)));
}
function streakNow(){const p=S.profile||{};return (p.lastDay===dayKey()||p.lastDay===dayKey(Date.now()-DAY))?(p.streak||0):0;}

const Store={db:null,base:null,local:false,pages:[],

function mergeLocal(b){
  (b.decks||[]).forEach(d=>{const cur=deckById(d.id);if(!cur||(d.upd||0)>(cur.upd||0))upsert(S.decks,d);});
  (b.cards||[]).forEach(c=>{const cur=cardById(c.id);if(!cur||(c.upd||0)>(cur.upd||0))upsert(S.cards,c);});
  (b.sugg||[]).forEach(s=>{if(!S.sugg.find(x=>x.id===s.id)&&cardById(s.cardId))upsert(S.sugg,s);});
  S.profile=mergeProfile(S.profile,b.profile||{});
}
function mergeProfile(a,b){const p=Object.assign({},b,a);const h=Object.assign({},b.hist||{});Object.entries(a.hist||{}).forEach(([k,v])=>h[k]=Math.max(v,h[k]||0));p.hist=h;
  if((b.lastDay||'')>(a.lastDay||'')){p.lastDay=b.lastDay;p.streak=b.streak;}p.lastCheck=Math.max(a.lastCheck||0,b.lastCheck||0);return p;}

function filterCards(d,st,ignore){

  if(st.topics.length&&ignore!=='topics')cs=cs.filter(c=>topicsOfCard(c).some(t=>st.topics.includes(t)));

function barChart(data,emptyMsg){
  const Wd=320,H=110,top=8,base=top+H,n=data.length,gap=4,bw=(Wd-gap*(n-1))/n,max=Math.max(1,...data.map(x=>x.v));
  let s=`<svg viewBox="0 0 ${Wd} ${base+18}" role="img"><line class="axis" x1="0" x2="${Wd}" y1="${base+.5}" y2="${base+.5}"/>`;
  data.forEach((x,i)=>{const X=i*(bw+gap),h=x.v?Math.max(3,x.v/max*H):0,Y=base-h,r=Math.min(4,bw/2,h);
    s+=`<g data-tip="${esc(x.tip)}" tabindex="0"><rect x="${X}" y="${top}" width="${bw}" height="${H}" fill="transparent"/>${h?`<path class="bar" d="M${X},${base} V${Y+r} Q${X},${Y} ${X+r},${Y} H${X+bw-r} Q${X+bw},${Y} ${X+bw},${Y+r} V${base} Z"/>`:''}</g>`;
    if(x.label)s+=`<text class="lbl" x="${X+bw/2}" y="${base+13}" text-anchor="middle">${esc(x.label)}</text>`;});
  s+=`<text class="lbl" x="0" y="${top-1}">макс. ${max}</text></svg>`;
  const sum=data.reduce((a,x)=>a+x.v,0);
  return `${s}<div class="readout">${sum?'Нажмите на столбик, чтобы увидеть значение.':esc(emptyMsg)}</div>`;
}

<div class="face back ic ruled"><div class="fhead"><span>${head}</span></div><div class="fbody">${back}</div></div></div></div>`;}
function buildOpts(c,field){const val=x=>field==='word'?x.word:x.translation;const seen=new Set([norm(val(c))]),ds=[];

    if(t.answer)h+=`<div class="ic details"><p class="wsm">${esc(String(it.text).replace(/[\[\]]/g,''))}${sayBtn(String(it.text).replace(/[\[\]]/g,''),d,'say')}</p><div class="ptr">${esc(it.hint)}</div></div>`+nextBtn;

function applyGrade(g){
  const t=S.train,it=t&&t.items[t.i];if(!it||!it.id)return;const c=cardById(it.id);const key=it.kind+':'+it.id+':'+(it.ans||'');
  if(!it.repeat&&c&&!t.graded.has(key)){t.graded.add(key);t.res[g]++;const nc=clone(c);nc.srs=gradeSrs(nc.srs,g);Store.putCard(nc);t.pending++;}
  if(g==='again'){const k=t.requeued.get(key)||0;if(k<2){t.requeued.set(key,k+1);t.items.splice(Math.min(t.items.length,t.i+4),0,Object.assign({},it,{repeat:true}));}}
}

  const t=S.train;if(!t||!t.pending)return;const n=t.pending;t.pending=0;
  const today=dayKey(),y=dayKey(Date.now()-DAY),p=Object.assign({},S.profile);
  if(p.lastDay===today)p.today=(p.today||0)+n;else{p.streak=p.lastDay===y?(p.streak||0)+1:1;p.today=n;p.lastDay=today;}

  if(t.st.mode==='listen'&&!t.answer&&!t.spoken&&it.kind==='card'){const c=cardById(it.id);if(c){speak(c.word,d);t.spoken=true;}}

const ART=/^(the|a|an|to|der|die|das|den|dem|des|ein|eine|einen|le|la|les|un|une|el|los|las|il|lo|gli|uno|una|het|een)\s+/i;

function enrichModal(){const d=deckById(S.deckId);if(!d)return;bsz();const P=aiParts(),cs=cardsOf(d.id);

  const groups=new Map();target.forEach(c=>{const k=[P.ph&&missPh(c),P.fm&&missFm(c),P.ex&&missEx(c)].join();groups.set(k,(groups.get(k)||0)+1);});
  const req=[...groups.values()].reduce((a,n)=>a+Math.ceil(n/ENRICH_B),0);

async function runAI(){
  const a=S.add,d=deckById(S.deckId);if(!a||!d||a.busy)return;
  const entries=parseEntries(a.text);if(!entries.length){a.error='Впишите хотя бы одно слово.';return render();}
  const have=new Set(cardsOf(d.id).map(c=>norm(c.word)).concat(a.drafts.map(x=>norm(x.word))));
  const fresh=entries.filter(e=>!have.has(norm(e.word)));a.skipped=entries.filter(e=>have.has(norm(e.word))).map(e=>e.word);a.error='';
  if(!fresh.length){a.text='';return render();}
  a.busy=true;a.ctl=new AbortController();const sig=a.ctl.signal,B=isManual()?25:10;let done=0;
  try{for(let i=0;i<fresh.length;i+=B){const batch=fresh.slice(i,i+B);
      a.progress=fresh.length>B?`Слова ${i+1}–${i+batch.length} из ${fresh.length}.`:'';if(S.add===a&&S.screen==='add')render();
      const res=await aiFill(batch,d,sig);a.drafts.push.apply(a.drafts,res);done=i+batch.length;}}
  catch(e){const m=handleAiErr(e);if(m)a.error=m;}
  a.busy=false;a.ctl=null;a.progress='';a.text=fresh.slice(done).map(e=>e.word+(e.userTr?' — '+e.userTr:'')).join('\n');
  if(S.add===a&&S.screen==='add')render();
}
function parseEntries(text){const seen=new Set(),out=[];
  String(text||'').split(/\n/).forEach(line=>{line=line.trim();if(!line)return;
    const m=line.split(/\s+[—–-]\s+|\t|\s*=\s*/);const word=(m[0]||'').trim();const userTr=m.slice(1).join(', ').trim();
    if(!word)return;const k=norm(word);if(seen.has(k))return;seen.add(k);out.push({word,userTr});});
  return out;}
async function cardAI(){
  const e=S.edit,c=cardById(S.cardId),d=c&&deckById(c.deckId);if(!e||!d||e.busy)return;
  if(!str(e.word))return toast('Впишите слово.');
  e.busy=true;e.err='';render();
  try{const r=(await aiFill([{word:str(e.word),userTr:str(e.translation)}],d))[0];if(S.edit!==e)return;
    if(!e.pos)e.pos=r.pos;if(!e.topic&&r.topic)e.topic=r.topic;if(!(e.phrases||[]).length&&r.phrases.length)e.phrases=r.phrases;
    if(!(e.formsList||[]).length&&r.formsList.length)e.formsList=r.formsList;if(!(e.examples||[]).length&&r.examples.length)e.examples=r.examples;
    if(!str(e.translation))e.translation=r.translation;}
  catch(err){const m=handleAiErr(err);if(m)e.err=m;}
  e.busy=false;if(S.edit===e&&S.screen==='card')render();
}

  say:el=>speak(el.dataset.text,deckById(S.train?S.train.deckId:(cardById(S.cardId)||{}).deckId||S.deckId)),

  'exit-train':()=>{commitStats();const q=S.train&&S.train.quick;S.train=null;go(q?'deck':'setup');},
  'again-round':()=>{const t=S.train;if(!t)return;const st=t.st,q=t.quick;S.train=null;startTrain(st,q);},
  login:async()=>{const pr=new firebase.auth.GoogleAuthProvider();
    try{await firebase.auth().signInWithPopup(pr);}catch(e){const c=(e&&e.code)||'';
      if(/popup-blocked|operation-not-supported|web-storage/.test(c)){try{await firebase.auth().signInWithRedirect(pr);}catch(e2){toast('Не удалось войти: '+((e2&&e2.code)||'ошибка'));}}
      else if(!/popup-closed|cancelled-popup/.test(c))toast('Не удалось войти. Проверьте интернет.'+(c?' ('+c+')':''));}},
  aimode:el=>{S.prefs.aiMode=el.dataset.v;savePrefs();setupSiteAI();settingsModal();keepScroll();},
  'save-key':()=>{const v=str(($('#api-key')||{}).value);S.prefs.apiKey=v;savePrefs();setupSiteAI();settingsModal();keepScroll();toast(v?'Ключ сохранён.':'Ключ удалён.');},
  'man-share':()=>{const m=S.manual;if(!m)return;if(navigator.share)navigator.share({text:m.prompt}).catch(()=>{});else A['man-copy']();},
  'man-copy':()=>{const m=S.manual;if(!m)return;(navigator.clipboard?navigator.clipboard.writeText(m.prompt):Promise.reject()).then(()=>toast('Запрос скопирован. Вставьте его в чат Claude.'),()=>toast('Не удалось скопировать.'));},
  'man-ok':()=>{const m=S.manual;if(!m)return;let o;try{o=looseJSON(($('#man-ans')||{}).value);}catch(e){return toast('Не получилось прочитать ответ. Скопируйте ответ Claude целиком.');}
    S.manual=null;closeModal();m.res(o);},
  'backup-snooze':()=>{S.prefs.backupSnooze=Date.now();savePrefs();keepScroll();},
  'local-only':()=>{S.prefs.localOnly=true;savePrefs();location.reload();},
  'sync-on':()=>{S.prefs.localOnly=false;savePrefs();location.reload();},
  logout:()=>{closeModal();firebase.auth().signOut();},
  'stash-up':()=>{const st=localStash();if(!st)return;(st.decks||[]).forEach(d=>Store._put('decks',clone(d),S.decks));Store.putProfile(mergeProfile(S.profile,st.profile||{}));
    runIO('Перенос в облако',st.cards,c=>Store._put('cards',clone(c),S.cards)).then(()=>{try{localStorage.setItem('fc-data-moved',localStorage.getItem('fc-data'));localStorage.removeItem('fc-data');}catch(e){}keepScroll();});},
  'close-modal':()=>closeModal()
};

document.addEventListener('click',e=>{const tip=e.target.closest('[data-tip]');if(tip)showTip(tip);
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=A[el.dataset.act];if(fn){e.preventDefault();e.stopPropagation();fn(el,e);}});
function showTip(g){const ch=g.closest('.chart');if(!ch)return;ch.querySelectorAll('g.on').forEach(x=>x.classList.remove('on'));g.classList.add('on');const r=ch.querySelector('.readout');if(r)r.textContent=g.dataset.tip;}
document.addEventListener('mouseover',e=>{const g=e.target.closest&&e.target.closest('[data-tip]');if(g)showTip(g);});
document.addEventListener('focusin',e=>{const g=e.target.closest&&e.target.closest('[data-tip]');if(g)showTip(g);});
const FMAP={phrases:['text','translation'],formsList:['l','f'],examples:['t','tr']};
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){S.q=t.value;S.listShow=60;const w=$('#wlist');if(w)w.innerHTML=wordRows(cardsOf(S.deckId));return;}
  if(t.id==='add-text'&&S.add){S.add.text=t.value;return;}
  const f=t.dataset&&t.dataset.f;if(f&&t.tagName!=='SELECT'){const box=t.closest('[data-scope]');if(!box)return;const obj=box.dataset.scope==='edit'?S.edit:(S.add&&S.add.drafts[+box.dataset.i]);if(!obj)return;
    if(FMAP[f])obj[f]=textToPairs(t.value,FMAP[f][0],FMAP[f][1]);else obj[f]=t.value;}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='file-in'){handleFile(t.files&&t.files[0]);return;}
  if(t.id==='f-lang'){const w=$('#f-cw');if(w)w.hidden=t.value!=='other';return;}
  if(t.id==='add-topic'){S.addTopic=t.value;return;}
  if(t.id==='list-topic'){S.listTopic=t.value;S.listShow=60;const w=$('#wlist');if(w)w.innerHTML=wordRows(cardsOf(S.deckId));return;}
  const f=t.dataset&&t.dataset.f;if(f&&t.tagName==='SELECT'){const box=t.closest('[data-scope]');if(!box)return;const obj=box.dataset.scope==='edit'?S.edit:(S.add&&S.add.drafts[+box.dataset.i]);if(!obj)return;
    if(f==='topic')setTopic(obj,t);else obj[f]=t.value;}});
document.addEventListener('keydown',e=>{
  const modalOpen=$('#modal').classList.contains('open');
  if(e.key==='Escape'&&modalOpen){closeModal();return;}
  if(modalOpen&&e.key==='Enter'&&e.target.id==='f-topic'){e.preventDefault();A['topic-new-ok']();return;}
  if(modalOpen||S.screen!=='train'||!S.train)return;const t=S.train;if(t.i>=t.items.length)return;
  const tag=(e.target.tagName||'').toLowerCase();const it=t.items[t.i];
  if(isTyped(t.st,it)&&e.key==='Enter'){e.preventDefault();if(!t.answer)check(false);else next();return;}
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  const flipLike=t.st.mode==='flip'||it.kind==='phrase';
  if(flipLike&&(e.key===' '||e.key==='Enter')&&tag!=='button'){e.preventDefault();doFlip();return;}
  if(t.st.mode==='flip'&&it.kind==='card'&&t.flipped&&/^[123]$/.test(e.key)){applyGrade(['again','hard','good'][+e.key-1]);next();return;}
  if((t.st.mode==='choice'||t.st.mode==='listen')&&!t.answer&&/^[1-4]$/.test(e.key)){pick(+e.key-1);return;}
  if(t.answer&&e.key==='Enter'&&tag!=='button'){e.preventDefault();next();}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('flip-inner')){e.preventDefault();e.stopImmediatePropagation();doFlip();}},true);

if(SITE&&'serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
Store.init().catch(()=>{S.loadErr='Не удалось загрузить данные. Проверьте интернет и обновите страницу.';render();});
setTimeout(()=>{if(!S.ready&&!S.loadErr){S.loadErr='Данные загружаются слишком долго. Проверьте интернет и обновите страницу.';render();}},20000);
</script>
